name: Cleanup on Release Delete

on:
  release:
    types: [deleted]

permissions:
  contents: write
  packages: write

jobs:
  cleanup_ghtag:
    runs-on: deploy
    steps:
      - name: Delete GitHub tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO_FULL: ${{ github.repository }}
        run: |
          echo "============================================"
          echo "Deleting GitHub tag: $TAG_NAME"
          echo "============================================"
          
          # Deleting tag
          if /usr/bin/gh api -X DELETE "/repos/$REPO_FULL/git/refs/tags/$TAG_NAME" 2>/dev/null; then
            echo "✅ Deleted GitHub tag: $TAG_NAME"
          else
            echo "ℹ️ Tag $TAG_NAME not found or already deleted"
          fi
          
