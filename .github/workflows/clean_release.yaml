      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{vars.CI_REGISTRY}}

      - name: Delete from ECR
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Name of the repository-то at ECR is: cloud/infrastructure, cloud/server etc.
          ECR_REPO="demos/$REPO_NAME"
          
          echo "========================================="
          echo "Deleting $ECR_REPO:$VERSION from ECR..."
          echo "Full URI: ${{vars.CI_REGISTRY}}/$ECR_REPO:$VERSION"
          echo "========================================="
          
          # Check if the image is there
          if aws ecr describe-images --repository-name "$ECR_REPO" \
            --region eu-central-1 \
            --image-ids imageTag="$VERSION" > /dev/null 2>&1; then
            
            echo "✅ Found $ECR_REPO:$VERSION, deleting..."
            
            # Delete image
            aws ecr batch-delete-image \
              --repository-name "$ECR_REPO" \
              --region eu-central-1 \
              --image-ids imageTag="$VERSION"
            
            echo "✅ Deleted $ECR_REPO:$VERSION from ECR"
          else
            echo "ℹ️ $ECR_REPO:$VERSION not found in ECR"
          fi

          # 2. Deleting untagged images
          echo "Deleting untagged images from $ECR_REPO..."
          
          UNTAGGED=$(aws ecr list-images --repository-name "$ECR_REPO" \
            --region eu-central-1 \
            --filter "tagStatus=UNTAGGED" \
            --query 'imageIds[*]' \
            --output json)
          
          if [ "$UNTAGGED" != "[]" ] && [ -n "$UNTAGGED" ]; then
            echo "$UNTAGGED" | jq -r '.[] | "imageDigest=\(.imageDigest)"' | \
              xargs -r -n 1 aws ecr batch-delete-image \
                --repository-name "$ECR_REPO" \
                --region eu-central-1 \
                --image-ids
            echo "✅ Deleted untagged images"
          else
            echo "ℹ️ No untagged images found"
          fi