name: Build images for Published release
on: 
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version"
        required: true
        default: ""
  release:
    types: [released, edited] 

permissions:
  contents: read
  packages: write

jobs:
  build_all:
    runs-on: 
      - lnx-build
    # if: ${{ ( inputs.component == 'all' && github.event_name == 'workflow_dispatch' ) || github.event_name == 'release' }}
    name: Build All images
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase repo name
        id: repo
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to ECR ${{vars.CI_REGISTRY}}
        run: |
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{vars.CI_REGISTRY}}

      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push All
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
          tags: |
            ${{vars.CI_REGISTRY}}/demos/${{ github.event.repository.name }}:latest
            ${{vars.CI_REGISTRY}}/demos/${{ github.event.repository.name }}:${{ github.event.inputs.release_version || github.event.release.tag_name }}
          provenance: false