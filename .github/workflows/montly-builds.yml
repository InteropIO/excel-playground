name: Monthly Rebuild Images
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_all:
    runs-on: 
      - lnx-build
    name: Build All images
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          # Takes all tags (includinf release tags)
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, using 'latest'"
            LATEST_TAG="latest"
          fi
          
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $LATEST_TAG"

      - name: Set lowercase repo name
        id: repo
        run: |
          # echo "REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin ${{vars.CI_REGISTRY}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push All
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          build-args: |
          tags: |
            ${{vars.CI_REGISTRY}}/${{ github.event.repository.name }}:latest
            ${{vars.CI_REGISTRY}}/${{ github.event.repository.name }}:${{ steps.latest_tag.outputs.LATEST_TAG }}
          provenance: false

      - name: Delete untagged images from ECR (FORCE)
        if: success()
        run: |
          echo "=== FORCE DELETING ALL UNTAGGED IMAGES ==="
          REPO_NAME="${{ github.event.repository.name }}/${{ matrix.component }}"
          
          # Delete all without tag (imageTags == null)
          echo "Method 1: Deleting images with no tags..."
          aws ecr describe-images \
            --repository-name $REPO_NAME \
            --region eu-central-1 \
            --query 'imageDetails[?imageTags==`null`].[imageDigest]' \
            --output text | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Deleting untagged image: $digest"
                aws ecr batch-delete-image \
                  --repository-name $REPO_NAME \
                  --image-ids imageDigest=$digest \
                  --region eu-central-1 || echo "Failed to delete $digest"
              fi
            done
          
          # Delete all with empty massive of tags
          echo "Method 2: Alternative deletion..."
          aws ecr describe-images \
            --repository-name $REPO_NAME \
            --region eu-central-1 \
            --output json | jq -r '.imageDetails[] | select(.imageTags == null or .imageTags == []) | .imageDigest' | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Deleting untagged image (alt): $digest"
                aws ecr batch-delete-image \
                  --repository-name $REPO_NAME \
                  --image-ids imageDigest=$digest \
                  --region eu-central-1 || echo "Failed to delete $digest"
              fi
            done
          
          # Delete all with "null" in output-а
          echo "Method 3: Cleaning up any remaining untagged images..."
          aws ecr describe-images \
            --repository-name $REPO_NAME \
            --region eu-central-1 \
            --output text | grep -A1 "TAGS" | grep "None" | while read -r line; do
              # Това е по-сложно, но горните методи би трябвало да свършат работа
              echo "Checking for more untagged images..."
            done
          
          echo "=== UNTAGGED IMAGES DELETION COMPLETED ==="
          
          echo "Remaining images in repository:"
          aws ecr describe-images --repository-name $REPO_NAME --region eu-central-1 --query 'imageDetails[*].[imageTags, imageDigest]' --output table
        continue-on-error: true

      - name: Log completion
        run: |
          echo "Successfully rebuilt ${{ matrix.component }} with tag: ${{ steps.latest_tag.outputs.LATEST_TAG }}"